name: settle
description: "Settle: a ledger-only expense splitter for Pakistan."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  google_sign_in: ^6.2.2
  intl: any
  flutter_svg: ^2.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/google_g.svg
  fonts:
    # Brand font: logo and headings (DESIGN.md §3, BRAND.md §4).
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700

# `dart run flutter_launcher_icons` (BRAND.md §5)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  min_sdk_android: 24
  adaptive_icon_background: "#0B8295"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  # The foreground PNG is already drawn on the 108-unit adaptive grid.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png

# `dart run flutter_native_splash:create` (BRAND.md §6)
flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#0B8295"
  image: assets/icon/icon_foreground.png
  branding: assets/icon/splash_branding.png
  android_12:
    color: "#0B8295"
    image: assets/icon/icon_foreground.png
    branding: assets/icon/splash_branding.png
